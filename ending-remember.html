<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050707">
  <meta name="robots" content="noindex">
  <title>结局 01 · 记得她 · 镜子里的304</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/shared.js" defer></script>
  <script src="assets/js/endings.js" defer></script>
</head>
<body class="ending-body ending-remember" data-ending="remember">
  <div class="grain" aria-hidden="true"></div>

  <header class="ending-header">
    <div class="brand">
      <span class="brand__seal" aria-hidden="true">青</span>
      <span class="brand__text">青石里旧楼档案<small>QSL ARCHIVE / CLOSED</small></span>
    </div>
    <div class="ending-label">ENDING 01 / 记得她<br>档案已封存</div>
  </header>

  <main class="ending-stage">
    <figure class="ending-remember__photo">
      <img src="assets/img/family-1999-clear.svg" alt="1999年的全家福。这一次，照片里女孩的脸清楚了一些。">
      <figcaption>
        <em>1999年春节，全家福。</em>
        <span>QSL — PHOTO / 01</span>
      </figcaption>
    </figure>

    <section class="ending-copy" aria-labelledby="ending-copy-title">
      <div class="ending-copy__kicker" id="ending-copy-title">许砚留下的最后一段文字</div>
      <div class="ending-copy__lines">
        <p>我终于记得她了。</p>
        <p>我没有打开那扇门。</p>
        <p>我不知道她现在过得怎么样，也不知道她还能不能回来。</p>
        <p>但至少，我没有再忘记她。</p>
        <p class="last-request">姐姐，如果你还能听见，就再敲三下吧。</p>
      </div>
      <div class="ending-knock" aria-label="三下敲击">
        <i></i><i></i><i></i>
      </div>
    </section>

    <button class="ending-skip" type="button" id="skip-to-end">跳过等待 →</button>
  </main>

  <div class="ending-black" id="ending-black">
    <p class="ending-black__line">“这一次，门外有人记得你。”</p>
    <div class="ending-black__foot">
      <a class="btn" href="index.html">回到档案首页</a>
      <button class="btn" type="button" data-reset>重新开始调查</button>
    </div>
  </div>
</body>
</html>
