<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">2000年夏天许家的客厅</title>
  <desc id="desc">夏日午后的旧客厅里，一个男孩坐在沙发上，一个女孩站在他身边。照片边缘能看见一台架在椅子上的相机。</desc>
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8a58b"/>
      <stop offset=".5" stop-color="#b3ab8b"/>
      <stop offset="1" stop-color="#847c65"/>
    </linearGradient>
    <linearGradient id="sofa2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b8365"/>
      <stop offset=".45" stop-color="#6f674e"/>
      <stop offset="1" stop-color="#504a37"/>
    </linearGradient>
    <linearGradient id="window2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e9c8"/>
      <stop offset=".55" stop-color="#d8d8b1"/>
      <stop offset="1" stop-color="#8e9a74"/>
    </linearGradient>
    <linearGradient id="girlDress2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d4c4"/>
      <stop offset=".58" stop-color="#babda9"/>
      <stop offset="1" stop-color="#7b816f"/>
    </linearGradient>
    <radialGradient id="sun2" cx=".8" cy=".22" r=".65">
      <stop offset="0" stop-color="#fff6cf" stop-opacity=".63"/>
      <stop offset=".4" stop-color="#f4e5b6" stop-opacity=".17"/>
      <stop offset="1" stop-color="#2a2719" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette2" cx=".51" cy=".41" r=".73">
      <stop offset=".36" stop-color="#1a160d" stop-opacity="0"/>
      <stop offset=".78" stop-color="#1a160d" stop-opacity=".15"/>
      <stop offset="1" stop-color="#100d07" stop-opacity=".45"/>
    </radialGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
    <filter id="lite2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation=".6"/>
    </filter>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency=".69" numOctaves="3" seed="29" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".42"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="clip2">
      <rect width="1200" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip2)">
    <rect width="1200" height="900" fill="url(#wall2)"/>

    <!-- 窗 -->
    <g>
      <rect x="938" y="78" width="292" height="495" fill="#5e5744" opacity=".65"/>
      <rect x="953" y="94" width="259" height="463" fill="url(#window2)"/>
      <path d="M954 96l256 458M1209 95L954 555" stroke="#7b8266" stroke-width="4" opacity=".5"/>
      <path d="M1081 94v464M953 325h259" stroke="#5d5746" stroke-width="12"/>
      <path d="M961 100h242v452H961Z" fill="none" stroke="#e7e4c6" stroke-width="2" opacity=".35"/>
      <rect x="937" y="76" width="295" height="14" fill="#5a513e"/>
      <rect x="981" y="558" width="201" height="20" fill="#5c513e" opacity=".7"/>
      <path d="M1141 563c27 74 17 160-11 224" fill="none" stroke="#b1baa0" stroke-width="20" opacity=".17"/>
      <path d="M1174 347c-10 57-7 115 3 167" stroke="#fff4c5" stroke-width="2" opacity=".12"/>
    </g>

    <!-- 客厅摆设 -->
    <g opacity=".5">
      <rect x="88" y="147" width="248" height="312" fill="none" stroke="#675c46" stroke-width="6"/>
      <rect x="104" y="164" width="216" height="279" fill="#b7ae91" stroke="#7c7158" stroke-width="2"/>
      <rect x="123" y="184" width="178" height="166" fill="#9f987e" stroke="#857a61" stroke-width="1"/>
      <path d="M125 344c34-47 58-43 91-7 27-27 55-15 82 9" fill="#7f816a" opacity=".45"/>
      <rect x="145" y="371" width="129" height="33" fill="none" stroke="#746954" opacity=".5"/>
      <text x="210" y="396" fill="#5f5644" font-family="serif" font-size="16" text-anchor="middle" opacity=".55">一九九九年 · 夏</text>
    </g>

    <!-- 地面 -->
    <rect y="690" width="1200" height="210" fill="#6e5f48"/>
    <path d="M0 704h1200M0 780h1200M0 861h1200" stroke="#4a3e2f" stroke-width="2" opacity=".33"/>
    <path d="M184 694l-49 206M493 694l-21 206M787 694l36 206M1040 694l70 206" stroke="#3c3226" stroke-width="2" opacity=".26"/>
    <ellipse cx="603" cy="858" rx="470" ry="104" fill="#4c3e2b" opacity=".28"/>

    <!-- 沙发 -->
    <g>
      <rect x="193" y="489" width="814" height="295" rx="30" fill="#4a4635"/>
      <path d="M218 526c-5-83 26-141 92-159l566 1c62 14 96 69 91 162l-8 163-741 6Z" fill="url(#sofa2)"/>
      <path d="M246 528c60-31 176-43 300-40 96 2 199 12 307 37l-17 140-575 4Z" fill="#7d7559"/>
      <path d="M261 553c78-26 172-34 269-31 92 3 184 13 268 33l-7 81H269Z" fill="#6f684f" opacity=".65"/>
      <path d="M208 701h782v82H208Z" fill="#59523e"/>
      <path d="M239 767v48M959 767v48" stroke="#3d382a" stroke-width="13"/>
      <path d="M244 544c45-21 101-29 162-26M831 520c8-3 15-4 22-5" fill="none" stroke="#a29a7d" stroke-width="2" opacity=".3"/>
      <!-- 靠枕 -->
      <g transform="rotate(-7 316 595)">
        <rect x="241" y="535" width="150" height="108" rx="10" fill="#8d8063"/>
        <path d="M256 547h120v84H256Z" fill="none" stroke="#5d5540" stroke-width="2" opacity=".5"/>
        <path d="M275 561c23 18 53 24 84 15M277 608c22-11 44-13 65-7" fill="none" stroke="#b5a784" stroke-width="2" opacity=".35"/>
      </g>
      <g transform="rotate(6 756 589)">
        <rect x="692" y="530" width="140" height="105" rx="8" fill="#63634f"/>
        <path d="M708 544h108v79H708Z" fill="none" stroke="#3f4233" stroke-width="2" opacity=".55"/>
      </g>
    </g>

    <!-- 女孩：许棠 -->
    <g>
      <path d="M714 693c-2-117 15-196 44-228 21-24 52-26 78-3 29 27 43 108 46 231l-2 46-163 2Z" fill="url(#girlDress2)"/>
      <path d="M738 686l-5 141h45l16-139M841 688l19 139h47l-17-140" fill="#858775"/>
      <path d="M733 815h52l3 23h-60ZM861 815h48l10 24h-59Z" fill="#3c4138"/>
      <path d="M716 694c-5-51 1-108 16-154M902 697c6-56 4-111-8-156" fill="none" stroke="#cfc8b8" stroke-width="2" opacity=".22"/>
      <path d="M778 407c1-38 21-63 51-63 31 0 51 26 51 63 0 38-21 65-53 65-32 0-50-27-49-65Z" fill="#c69a78"/>
      <path d="M763 422c-9-42 5-80 37-96 29-15 67-4 84 22 12 18 14 47 4 70-2-20-8-37-23-49-9 11-27 18-48 20-24 2-38 12-43 34-4 7-7 13-11 19-3-6-3-13 0-20Z" fill="#2f2821"/>
      <path d="M764 406c-7 38-5 87 1 124 5 31 2 78-3 107M886 408c8 40 7 91 0 127-4 25 1 73 6 98" fill="none" stroke="#302821" stroke-width="17" stroke-linecap="round"/>
      <path d="M782 398c7-6 14-7 21-3M840 394c7-4 14-2 19 3" stroke="#4b3527" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M787 414c3-2 7-2 10 0M839 413c3-2 7-2 10 0" stroke="#3b291e" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M812 420c-1 8 2 13 5 15" stroke="#9b6e51" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M798 444c7 4 14 4 22-1" stroke="#8b5542" stroke-width="2.3" fill="none" stroke-linecap="round"/>
      <path d="M813 543c8 13 19 18 32 16" fill="none" stroke="#9a9e8b" stroke-width="2" opacity=".5"/>
      <path d="M766 675c1 17 10 27 26 27 15 0 25-11 25-27" fill="#b88966" opacity=".7"/>
      <path d="M846 677c2 15 10 23 23 22 12-1 19-9 18-23" fill="#b88966" opacity=".7"/>
      <path d="M737 560l-2 120M873 559l9 118" stroke="#747867" stroke-width="2" opacity=".28"/>
    </g>

    <!-- 男孩：许砚 -->
    <g>
      <path d="M386 570c-15 35-24 82-22 130l12 110 150 5 18-114c5-43-9-92-31-127l-127-4Z" fill="#d2ccba"/>
      <path d="M388 804c-2 26 5 40 25 41h115c18-2 24-16 18-41Z" fill="#777e70"/>
      <path d="M404 572c8 46 20 74 39 96M523 573c-10 42-25 73-46 95" fill="none" stroke="#a8a895" stroke-width="2" opacity=".38"/>
      <path d="M402 585c-18 20-34 34-57 38M541 585c17 17 32 29 51 34" fill="#c49a75" opacity=".65"/>
      <path d="M432 468c1-41 25-67 57-67 34 0 56 29 56 69 0 39-21 66-57 66-35 0-56-27-56-68Z" fill="#c89873"/>
      <path d="M416 467c4-49 31-77 75-77 46 0 72 33 74 81-10-13-25-21-45-21-15 0-28-7-36-17-9 15-25 25-48 28-8 1-14 3-20 6Z" fill="#322920"/>
      <path d="M437 460c7-7 15-8 22-4M520 457c7-3 15-1 20 5" stroke="#4a382c" stroke-width="2.3" fill="none" stroke-linecap="round"/>
      <path d="M444 476c3-2 7-2 10 0M517 475c3-2 7-2 10 0" stroke="#3b2a20" stroke-width="2.1" fill="none" stroke-linecap="round"/>
      <path d="M478 480c-1 8 2 13 6 15" stroke="#966a50" stroke-width="1.9" fill="none" stroke-linecap="round"/>
      <path d="M457 503c10 6 21 6 32 1" stroke="#7d4739" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M407 568c-8 34-10 66-6 98M530 567c8 36 10 71 6 106" fill="none" stroke="#bfb9a7" stroke-width="2" opacity=".35"/>
      <path d="M438 599c8 14 26 19 48 18 21-2 36-9 44-23" fill="none" stroke="#a5a591" stroke-width="2" opacity=".45"/>
      <path d="M405 841h61l4 20h-73ZM505 841h60l8 21h-74Z" fill="#3c4038"/>
    </g>

    <!-- 女孩搭在沙发上的手 -->
    <g>
      <path d="M848 662c18 4 34 16 43 34 4 8-2 17-11 17-8 0-11-5-17-7-8-3-17 1-23-4-8-7-3-20 8-24Z" fill="#be8e6d"/>
      <path d="M855 687c6 6 12 12 16 20M860 681c7 7 13 13 18 21" stroke="#906145" stroke-width="1.3" fill="none" opacity=".5"/>
    </g>

    <!-- 相机与椅子暗示自拍 -->
    <g opacity=".78">
      <path d="M1044 706l52 150M1102 706l-40 147M1064 861l32 2" stroke="#3b3528" stroke-width="7" fill="none"/>
      <path d="M1031 692h94v51h-94Z" fill="#242720" stroke="#171a15" stroke-width="3"/>
      <circle cx="1078" cy="717" r="18" fill="#4d5142" stroke="#161914" stroke-width="4"/>
      <circle cx="1078" cy="717" r="9" fill="#1b1d18"/>
      <rect x="1054" y="687" width="25" height="10" rx="2" fill="#33372d"/>
      <circle cx="1109" cy="700" r="3" fill="#a9573f"/>
      <path d="M1035 743c-26 19-39 40-38 63" fill="none" stroke="#4e4430" stroke-width="4"/>
      <rect x="1000" y="795" width="55" height="54" rx="5" fill="#59513e"/>
      <path d="M1010 808h34v28h-34Z" fill="none" stroke="#8c8067" stroke-width="1" opacity=".5"/>
    </g>

    <!-- 尘埃 / 光 -->
    <g fill="#fff5d3" opacity=".42">
      <circle cx="930" cy="222" r="2.2"/>
      <circle cx="990" cy="305" r="1.4"/>
      <circle cx="873" cy="394" r="1.6"/>
      <circle cx="1065" cy="248" r="1.2"/>
      <circle cx="1134" cy="401" r="2"/>
      <circle cx="805" cy="190" r="1.3"/>
      <circle cx="959" cy="476" r="1.4"/>
    </g>
    <rect width="1200" height="900" fill="url(#sun2)"/>
    <path d="M0 0h1200v900H0Z" fill="url(#vignette2)"/>
    <path d="M169 132c25 90 27 227 5 331" stroke="#f2e5be" stroke-width="1" opacity=".1"/>
    <path d="M72 704c8 24 4 47-7 69M948 825c-11 10-16 21-15 35" fill="none" stroke="#e1d3b1" stroke-width="1" opacity=".1"/>
    <rect width="1200" height="900" filter="url(#grain2)" opacity=".2" style="mix-blend-mode:overlay"/>
  </g>
</svg>
