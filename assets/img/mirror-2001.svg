<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">2001年春天，走廊尽头的镜子</title>
  <desc id="desc">陈旧的三楼走廊，一个女孩站在尽头的镜子前。镜子里除了她，还映出一扇本不该存在的门，门牌上的数字隐约像304。</desc>
  <defs>
    <linearGradient id="backWall3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a896b"/>
      <stop offset=".55" stop-color="#857457"/>
      <stop offset="1" stop-color="#66573f"/>
    </linearGradient>
    <linearGradient id="leftWall3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f3428"/>
      <stop offset=".7" stop-color="#6c5b45"/>
      <stop offset="1" stop-color="#847258"/>
    </linearGradient>
    <linearGradient id="rightWall3" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#3c3328"/>
      <stop offset=".7" stop-color="#6a5a44"/>
      <stop offset="1" stop-color="#847258"/>
    </linearGradient>
    <linearGradient id="floor3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#30261b"/>
      <stop offset=".62" stop-color="#5c4a36"/>
      <stop offset="1" stop-color="#7a664d"/>
    </linearGradient>
    <linearGradient id="mirrorGlass3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28332f"/>
      <stop offset=".38" stop-color="#111a19"/>
      <stop offset=".73" stop-color="#1a2421"/>
      <stop offset="1" stop-color="#09100f"/>
    </linearGradient>
    <linearGradient id="mirrorDoor3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33291f"/>
      <stop offset=".35" stop-color="#5e4832"/>
      <stop offset=".72" stop-color="#2b2018"/>
      <stop offset="1" stop-color="#110d0b"/>
    </linearGradient>
    <linearGradient id="lamp3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffcaa" stop-opacity=".68"/>
      <stop offset=".7" stop-color="#e5c579" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ba9559" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flash3" cx=".49" cy=".17" r=".7">
      <stop offset="0" stop-color="#f8eccf" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#f1dfba" stop-opacity=".03"/>
      <stop offset="1" stop-color="#20180f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette3" cx=".52" cy=".43" r=".75">
      <stop offset=".3" stop-color="#0c0905" stop-opacity="0"/>
      <stop offset=".75" stop-color="#0c0905" stop-opacity=".19"/>
      <stop offset="1" stop-color="#080604" stop-opacity=".58"/>
    </radialGradient>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="2.3"/>
    </filter>
    <filter id="blurLite3">
      <feGaussianBlur stdDeviation=".7"/>
    </filter>
    <filter id="reflectionBlur">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency=".76" numOctaves="3" seed="31" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".43"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="mirrorClip">
      <rect x="625" y="243" width="326" height="472" rx="4"/>
    </clipPath>
    <clipPath id="frame3">
      <rect width="1200" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame3)">
    <rect width="1200" height="900" fill="#17120d"/>

