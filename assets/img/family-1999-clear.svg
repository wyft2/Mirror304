<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">1999年春节的全家福</title>
  <desc id="desc">暖黄色的室内，一家四口面对镜头。父亲、母亲、一个男孩和站在中间的女孩。女孩的脸比旧照片中清楚了一些，但仍带着胶片颗粒。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a584"/>
      <stop offset=".58" stop-color="#aa9270"/>
      <stop offset="1" stop-color="#846c50"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#755a3f"/>
      <stop offset="1" stop-color="#3e2f22"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e5437"/>
      <stop offset=".28" stop-color="#9a7b56"/>
      <stop offset=".46" stop-color="#6d5136"/>
      <stop offset=".7" stop-color="#b0946a"/>
      <stop offset="1" stop-color="#5c452f"/>
    </linearGradient>
    <linearGradient id="fatherCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3e4038"/>
      <stop offset=".55" stop-color="#252923"/>
      <stop offset="1" stop-color="#161a16"/>
    </linearGradient>
    <linearGradient id="motherCardigan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#87493b"/>
      <stop offset=".55" stop-color="#69362e"/>
      <stop offset="1" stop-color="#47241f"/>
    </linearGradient>
    <linearGradient id="girlDress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1d1ad"/>
      <stop offset=".55" stop-color="#cab78f"/>
      <stop offset="1" stop-color="#846d4d"/>
    </linearGradient>
    <linearGradient id="boyShirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7d2bf"/>
      <stop offset=".48" stop-color="#b8b8a8"/>
      <stop offset="1" stop-color="#818778"/>
    </linearGradient>
    <radialGradient id="flash" cx=".48" cy=".2" r=".65">
      <stop offset="0" stop-color="#fff6d9" stop-opacity=".37"/>
      <stop offset=".4" stop-color="#fff4d4" stop-opacity=".1"/>
      <stop offset="1" stop-color="#20180f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".42" r=".74">
      <stop offset=".38" stop-color="#160f08" stop-opacity="0"/>
      <stop offset=".8" stop-color="#160f08" stop-opacity=".16"/>
      <stop offset="1" stop-color="#100b06" stop-opacity=".48"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="softLite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="girlBlur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".74" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".46"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="900" fill="url(#wall)"/>

    <!-- 窗与窗帘 -->
    <rect x="18" y="0" width="235" height="655" fill="#5e482f" opacity=".7"/>
    <path d="M34 0h190v648c-48 30-76-10-118 4C70 660 42 643 34 652Z" fill="url(#curtain)"/>
    <path d="M52 0v635M101 0v626M157 0v638M204 0v608" stroke="#d1b889" stroke-width="2" opacity=".18"/>
    <path d="M86 0c15 88 6 207 17 302s-2 171 14 249M180 0c-11 113 9 207-4 326s7 140 1 223" fill="none" stroke="#4a3523" stroke-width="8" opacity=".22"/>
    <rect x="20" y="658" width="248" height="14" fill="#4b3826" opacity=".65"/>

    <!-- 墙面装饰 -->
    <g opacity=".54">
      <rect x="859" y="167" width="178" height="236" fill="none" stroke="#5b4934" stroke-width="4"/>
      <rect x="874" y="182" width="148" height="206" fill="#c0ad89" stroke="#7e6849" stroke-width="1.5"/>
      <path d="M890 212h116M890 228h116M890 244h116M890 260h116M890 276h116M890 292h116M890 308h116M890 324h78" stroke="#73624a" stroke-width="1" opacity=".34"/>
      <text x="948" y="354" fill="#78674d" font-family="serif" font-size="68" text-anchor="middle" opacity=".35">福</text>
    </g>

    <!-- 墙脚线 / 地面 -->
    <rect y="642" width="1200" height="21" fill="#5d4934" opacity=".72"/>
    <rect y="663" width="1200" height="237" fill="url(#floor)"/>
    <path d="M0 690h1200M0 760h1200M0 842h1200" stroke="#2c2016" stroke-width="2" opacity=".35"/>
    <path d="M234 663l-36 237M445 663l-16 237M707 663l22 237M961 663l48 237" stroke="#2b1f15" stroke-width="3" opacity=".26"/>

    <!-- 地毯 -->
    <ellipse cx="616" cy="861" rx="470" ry="123" fill="#4f3524" opacity=".58"/>
    <ellipse cx="616" cy="861" rx="391" ry="92" fill="none" stroke="#c1a67c" stroke-width="3" opacity=".12"/>
    <ellipse cx="616" cy="861" rx="330" ry="70" fill="none" stroke="#c1a67c" stroke-width="1.5" opacity=".1"/>

    <!-- 父亲 -->
    <g>
      <path d="M268 687c-7-121 22-214 85-240 34-14 72-9 98 16 33 32 44 118 36 224l-5 58-213 5Z" fill="url(#fatherCoat)"/>
      <path d="M302 687l-3 147h67l17-150M407 688l20 146h69l-14-147" fill="#1c201c"/>
      <path d="M300 837h77l5 23h-87ZM417 835h66l12 25h-82Z" fill="#111411"/>
      <path d="M348 461c3-35 24-58 51-58 28 0 46 24 44 56-2 32-17 60-48 60-30 0-49-27-47-58Z" fill="#ba8f6d"/>
      <path d="M338 446c2-38 27-56 56-55 36 0 55 23 56 55-8-18-24-27-42-29-12 15-31 24-70 29Z" fill="#29231e"/>
      <path d="M347 441c6-8 13-9 19-6M394 434c8-3 14-2 19 5" stroke="#3d2d22" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M360 451c3-2 6-2 9 0M389 450c3-2 6-2 9 0" stroke="#36251a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M378 456c-1 8 2 13 5 14" stroke="#8a5f44" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M364 479c8 4 17 4 25-1" stroke="#71452f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M330 481c-2 69 0 121 8 178M433 476c6 61 9 125 4 185" stroke="#171a16" stroke-width="5" fill="none" opacity=".7"/>
      <path d="M337 533l100 17M342 560l89 12" stroke="#10120f" stroke-width="2" opacity=".35"/>
      <path d="M349 454c-2 29-7 44-23 55M412 452c4 27 11 43 29 54" stroke="#a27a5b" stroke-width="2" fill="none" opacity=".5"/>
      <path d="M294 675c-3 19 4 30 23 31 20 1 31-8 29-26" fill="#a97a58" opacity=".8"/>
      <path d="M430 670c4 17-2 30-18 33-15 3-25-5-25-22" fill="#a97a58" opacity=".8"/>
    </g>

    <!-- 母亲 -->
    <g>
      <path d="M709 682c-1-104 19-196 75-223 34-16 71-9 98 17 27 27 36 94 32 205l-8 62-192-1Z" fill="url(#motherCardigan)"/>
      <path d="M746 683l-5 153h54l17-153M845 683l20 153h55l-18-153" fill="#4c2922"/>
      <path d="M741 836h61l4 24h-71ZM861 836h55l10 25h-67Z" fill="#2b1714"/>
      <path d="M770 438c0-35 20-57 52-58 32 0 52 23 53 55 0 35-18 64-54 64-33 0-52-29-51-61Z" fill="#c49a77"/>
      <path d="M758 445c-5-36 11-70 43-81 31-10 64 5 73 33 4 15 3 32-1 48-3-17-11-31-25-39-8 10-19 15-37 16-14 1-29 6-38 19-6 8-11 18-13 28-4-7-5-15-2-24Z" fill="#342a22"/>
      <path d="M770 471c-4 19 2 34 14 41M850 468c5 20 0 34-11 43" fill="#b18463" opacity=".75"/>
      <path d="M777 435c7-7 14-7 20-4M819 430c7-3 14-2 19 4" stroke="#493327" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M781 447c3-2 6-2 9 0M816 447c3-2 6-2 9 0" stroke="#3b281e" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M800 451c-1 8 1 13 5 15" stroke="#92664d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M788 477c8 4 16 4 24-1" stroke="#7e4a3d" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M786 556c5 13 15 22 28 23 12 1 21-5 26-15" fill="none" stroke="#934d3e" stroke-width="2" opacity=".55"/>
      <path d="M760 657c6 12 19 18 35 16 16-2 25-11 28-24" fill="#b88865" opacity=".72"/>
      <path d="M831 662c4 12 0 22-12 26-12 5-22-1-26-12" fill="#b88865" opacity=".72"/>
    </g>

    <!-- 女孩：许棠 -->
    <g>
      <path d="M568 685c-2-139 16-222 43-260 18-24 46-30 69-11 32 25 50 108 52 271l-1 49-158 2Z" fill="url(#girlDress)"/>
      <path d="M571 498c10-39 28-61 56-64 30-3 53 17 70 61l-12 77-105 2Z" fill="#d8c8a7"/>
      <path d="M595 397c1-41 19-68 47-70 30-2 50 23 51 62 1 39-17 68-50 70-33 2-49-26-48-62Z" fill="#ceb094" filter="url(#softLite)"/>
      <path d="M586 402c-12-31-1-72 21-92 26-24 65-21 86 2 16 18 20 49 10 75-7-22-16-36-32-45-17-8-36-7-49 3-13 10-20 26-24 48-5 4-8 6-12 9Z" fill="#2b2721" filter="url(#softLite)"/>
      <path d="M598 333c-13 33-16 126-10 170 6 45 1 121-2 172M698 336c11 40 16 113 10 161-4 32 3 105 5 177" fill="none" stroke="#29251f" stroke-width="19" stroke-linecap="round" filter="url(#softLite)"/>
      <path d="M590 416c-4 28 3 46 18 54M690 417c5 27-3 45-17 54" fill="none" stroke="#b19379" stroke-width="2" opacity=".7" filter="url(#softLite)"/>
      <path d="M609 393c6-5 12-5 17-2M653 391c5-2 11-1 15 3" stroke="#3b3027" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#softLite)"/>
      <path d="M613 407c3-2 6-2 8 0M657 406c3-2 6-2 8 0" stroke="#35291f" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#softLite)"/>
      <path d="M637 411c-1 7 1 11 4 13" stroke="#9e7056" stroke-width="1.6" fill="none" stroke-linecap="round" filter="url(#softLite)"/>
      <path d="M625 432c6 3 12 3 18-1" stroke="#8d5946" stroke-width="2.1" fill="none" stroke-linecap="round" filter="url(#softLite)"/>
      <path d="M587 676c-2-50 3-82 19-102M683 676c1-52-4-81-16-101" fill="none" stroke="#b3a07f" stroke-width="2" opacity=".36"/>
      <path d="M584 687c0-24 12-37 29-35 17 2 24 15 24 36M643 688c0-23 10-37 27-36 17 1 27 15 27 37" fill="#b39476" opacity=".8"/>
      <path d="M601 559c7 12 19 18 35 17 15-1 26-8 31-19" fill="none" stroke="#a28c69" stroke-width="2" opacity=".45"/>
    </g>

    <!-- 男孩：许砚 -->
    <g>
      <path d="M468 692c-5-96 15-174 60-198 36-20 85-13 111 15 33 35 48 111 45 205l-7 50-205 2Z" fill="url(#boyShirt)"/>
      <path d="M469 691l-8 133h52l14-136M633 689l28 136h52l-25-139" fill="#727c71"/>
      <path d="M465 816h59l-3 36h-67ZM650 816h53l13 37h-60Z" fill="#313b35"/>
      <path d="M501 684c-1-62 16-114 47-147M615 691c4-58-6-103-31-143" fill="none" stroke="#8c927e" stroke-width="2" opacity=".32"/>
      <path d="M510 752c8 16 24 23 42 22 19-1 34-10 41-25" fill="#b3ab8e" opacity=".3"/>
      <path d="M512 620c0-39 24-63 54-63 32 0 53 25 53 62 0 39-20 65-54 65-33 0-53-27-53-64Z" fill="#c2946b"/>
      <path d="M497 620c3-45 28-70 68-70 42 0 65 29 67 72-7-13-20-22-38-22-14 0-24-9-30-18-13 21-35 30-67 38Z" fill="#30271f"/>
      <path d="M514 616c7-7 14-8 21-5M573 612c7-3 15-2 21 5" stroke="#49372a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M522 631c3-2 7-2 10 0M576 630c3-2 7-2 10 0" stroke="#3b2a20" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M549 633c-1 9 2 14 6 16" stroke="#956a4f" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M531 659c10 6 21 6 32 0" stroke="#7d493a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M494 705c-16 10-29 8-38-4M650 704c17 9 31 5 39-6" fill="#bf956f" opacity=".65"/>
      <path d="M474 799h51l6 17h-63M646 797h46l15 17h-55Z" fill="#cbc4b1" opacity=".7"/>
      <path d="M497 722c12 8 30 9 44 1M596 721c13 7 29 6 40-2" fill="none" stroke="#646e61" stroke-width="1.8" opacity=".35"/>
