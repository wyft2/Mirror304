    <!-- 光影与照片质感 -->
    <rect width="1200" height="900" fill="url(#flash)"/>
    <path d="M887 63c-26 54-25 112 5 158" stroke="#fff4d1" stroke-width="1" opacity=".08"/>
    <path d="M955 77c-16 39-15 77 2 113" stroke="#fff4d1" stroke-width="1" opacity=".06"/>
    <path d="M170 702c9 21 7 41-4 63M953 741c-8 18-6 34 2 51" fill="none" stroke="#d4c2a2" stroke-width="1" opacity=".12"/>
    <rect x="74" y="219" width="1" height="281" fill="#f5e6c6" opacity=".08" transform="rotate(3 74 219)"/>
    <rect width="1200" height="900" fill="url(#vignette)"/>
    <rect width="1200" height="900" filter="url(#grain)" opacity=".23" style="mix-blend-mode:overlay"/>
    <path d="M0 897h1200" stroke="#3b2a1d" stroke-width="4" opacity=".5"/>
  </g>
</svg>
